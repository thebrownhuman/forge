server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hash routing means every URL is index.html; no SPA rewrite needed,
    # but this keeps a stray deep link from 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames are immutable; index.html must never be cached or a
    # deploy leaves the browser on the previous build.
    location ~* \.(js|css|woff2?|png|jpg|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
